<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление операции</title>
</head>
<body>
    <h1>Добавление операции</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if message %}
        <p style="color: green;">{{ message }}</p>
    {% endif %}

    <form method="post" action="/add_operation">
        <label for="type_operation">Тип операции:</label>
        <select id="type_operation" name="type_operation" required>
            <option value="расход">Расход</option>
            <option value="доход">Доход</option>
        </select>

        <br><br>

        <label for="sum">Сумма:</label>
        <input type="number" id="sum" name="sum" step="0.01" required>

        <br><br>

        <label for="date">Дата операции:</label>
        <input type="date" id="date" name="date" required>

        <br><br>

        <label for="category_id">Категория:</label>
        <select id="category_id" name="category_id" required>
            {% for category in categories %}
                <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>

        <br><br>

        <button type="submit">Добавить операцию</button>
    </form>
</body>
</html>
